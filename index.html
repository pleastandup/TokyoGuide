<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>도쿄 긴자·신주쿠·시부야 가이드</title>
<style>
:root {
  --bg: #faf7f2;
  --card: #fff;
  --text: #222;
  --sub: #666;
  --line: #e8e2d8;
  --accent: #d6372b;
  --chip: #fbe9e7;
  --star: #f59e0b;
  --elder-bg: #fdf2f4;
  --elder-text: #c026d3;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #17161a;
    --card: #222126;
    --text: #eee;
    --sub: #aaa;
    --line: #34323a;
    --accent: #ff6b5e;
    --chip: #3a2422;
    --elder-bg: #381e2b;
    --elder-text: #f472b6;
  }
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  line-height: 1.5;
}
main { max-width: 640px; margin: 0 auto; padding: 16px 16px 40px; }
h1 { font-size: 1.4rem; margin: 6px 0 4px; }
.lead { color: var(--sub); font-size: .9rem; margin: 0 0 16px; }
.back { background: none; border: 0; color: var(--accent); font-size: .95rem; padding: 6px 0; cursor: pointer; font-weight: bold; }
.grid { display: grid; gap: 10px; }
.grid.two { grid-template-columns: 1fr 1fr; }
.tile { display: block; width: 100%; text-align: left; background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 14px; padding: 16px; cursor: pointer; }
.tile .e { font-size: 1.8rem; display: block; margin-bottom: 4px; }
.tile b { font-size: 1.05rem; }
.tile small { display: block; color: var(--sub); margin-top: 2px; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 10px; position: sticky; top: 0; background: var(--bg); z-index: 10; }
.chip { white-space: nowrap; border: 0; background: var(--chip); color: var(--accent); padding: 6px 14px; border-radius: 999px; font-size: .85rem; cursor: pointer; }
.chip.on { background: var(--accent); color: #fff; }
h2 { font-size: 1rem; margin: 18px 0 8px; border-left: 4px solid var(--accent); padding-left: 8px; }
.item { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; }
.item-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.item b { font-size: 1rem; }
.rating { font-size: .82rem; font-weight: 600; color: var(--star); white-space: nowrap; }
.rating small { color: var(--sub); font-weight: normal; margin-left: 2px; }
.item p { margin: 6px 0 8px; font-size: .88rem; color: var(--sub); }
.item-actions { display: flex; gap: 6px; align-items: center; }
.item a { font-size: .82rem; color: var(--accent); text-decoration: none; border: 1px solid var(--accent); border-radius: 999px; padding: 3px 10px; display: inline-block; }
.badge-elder { display: inline-block; background: var(--elder-bg); color: var(--elder-text); font-size: .75rem; font-weight: bold; padding: 2px 8px; border-radius: 6px; margin-bottom: 4px; }
footer { color: var(--sub); font-size: .78rem; margin-top: 24px; text-align: center; }
</style>
</head>
<body>
<main id="app"></main>

<script>
var areas = ['신주쿠', '긴자', '시부야', '도쿄역/기타'];
var currentArea = '전체';

// 데이터 배열 구조: [명칭, 지역, 설명, 구글검색어, 평점, 리뷰수, 어르신추천여부(true/false)]
var data = {
  sushi: {
    title: '초밥/일식', emoji: '🍣',
    items: [
      ['스시잔마이 신주쿠히가시구치점', '신주쿠', '좌석 간격이 넓고 쾌적하여 장모님을 모시고 편안하게 신선한 초밥을 즐기기 좋습니다.', 'すしざんまい 新宿東口店', '4.1', '3,900+', true],
      ['스시노미도리 긴자점', '긴자', '신선하고 도톰한 재료로 유명하며 테이블석이 정갈하여 가족 단위로 즐기기 좋습니다.', '梅丘寿司の美登利 銀座店', '4.2', '2,900+', true],
      ['스시노미도리 시부야점', '시부야', '시부야 마크시티 내 위치해 엘리베이터 이동이 편하고 쾌적하게 초밥을 맛볼 수 있어요.', '梅丘寿司の美登利 渋谷店', '4.3', '4,500+', true],
      ['네무로 하나마루 킷테점', '도쿄역/기타', '도쿄역 마루노우치 킷테(KITTE) 빌딩 5층에 있어 접근성이 뛰어나고 매장이 매우 넓고 쾌적해요.', '根室花まる 丸の内店', '4.1', '6,200+', true]
    ]
  },
  katsu: {
    title: '돈카츠/일식정식', emoji: '🍱',
    items: [
      ['돈카츠 와코 신주쿠 타카시마야점', '신주쿠', '백화점 상권 내 위치해 엘리베이터 이용이 편리하며 정갈한 튀김 정식을 편하게 즐길 수 있어요.', 'とんかつ和幸 新宿タカシマヤ店', '4.2', '1,800+', true],
      ['카츠센 긴자', '긴자', '긴자에서 차분하고 고급스러운 분위기로 정평이 난 돈카츠 전문점으로 어르신 모시기에 아주 좋습니다.', 'かつせん 銀座', '4.3', '1,400+', true],
      ['규카츠 모토무라 신주쿠 남구치점', '신주쿠', '화로 구이 맛집이나 지하 계단 이동 및 대기가 있어 장모님 동반 시 주의가 필요해요.', '牛かつもと村 新宿南口店', '4.4', '4,800+', false],
      ['규카츠 모토무라 시부야 본점', '시부야', '겉바속촉 규카츠로 유명하나 내부 좌석 및 대기 공간이 협소한 편입니다.', '牛かつもと村 渋谷本店', '4.4', '5,100+', false]
    ]
  },
  noodle: {
    title: '우동/라멘/면', emoji: '🍜',
    items: [
      ['우동 스이사와 신주쿠 타카시마야점', '신주쿠', '타카시마야 백화점 13층에 위치해 쾌적한 환경에서 깊은 풍미의 수제 우동을 즐기실 수 있어요.', '水沢うどん 水澤 新宿タカシマヤ店', '4.2', '520+', true],
      ['긴자 하치고', '긴자', '미쉐린 빕구르망의 정갈하고 맑은 라멘이나 좌석 수가 적고 장시간 야외 웨이팅이 필요합니다.', '銀座 八五', '4.3', '2,100+', false],
      ['이치란 신주쿠 중앙동구치점', '신주쿠', '독서실형 1인 칸막이 구조로 가족 간 대화하며 식사하기에는 적합하지 않아요.', '一蘭 新宿中央東口店', '4.3', '8,900+', false]
    ]
  },
  yaki: {
    title: '야키니쿠/고기', emoji: '🥩',
    items: [
      ['야키니쿠 토라지 신주쿠점', '신주쿠', '넓은 룸과 정갈한 테이블 좌석이 구비되어 장모님 모시고 쾌적하게 최고급 와규 구이를 즐길 수 있어요.', '焼肉トラジ 新宿店', '4.2', '1,300+', true],
      ['야키니쿠 토라지 긴자 8초메점', '긴자', '독립된 개별 룸과 정돈된 분위기를 갖추고 있어 품격 있는 식사가 가능합니다.', '焼肉トラジ 銀座8丁目店', '4.2', '1,100+', true]
    ]
  },
  cafe: {
    title: '카페/다이닝', emoji: '🍰',
    items: [
      ['카페 세이부 니시신주쿠점', '신주쿠', '레트로하고 화려한 다방 감성 속에서 넓고 편안한 좌석에 앉아 디저트와 커피를 여유롭게 즐기기 좋습니다.', '珈琲西武 西新宿店', '4.3', '2,500+', true],
      ['블루보틀 커피 긴자 카페', '긴자', '쇼핑몰 내 쾌적하고 깔끔한 공간에 위치해 대화하며 쉬어가기 매우 좋아요.', 'ブルーボトルコーヒー 銀座カフェ', '4.2', '2,200+', true]
    ]
  }
};

function getMapLink(query) {
  return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(query);
}

function render() {
  var hash = location.hash.replace('#/', '');
  var appEl = document.getElementById('app');
  var html = '';

  if (!hash) {
    html += '<h1>도쿄 긴자·신주쿠·시부야 가이드</h1>';
    html += '<p class="lead">가족 여행(장모님 모심)을 위한 쾌적 식당 가이드예요</p>';
    html += '<div class="grid two">';
    for (var key in data) {
      var cat = data[key];
      html += '<button class="tile" onclick="location.hash=\'#/' + key + '\'">';
      html += '<span class="e">' + cat.emoji + '</span>';
      html += '<b>' + cat.title + '</b>';
      html += '<small>' + cat.items.length + '곳</small>';
      html += '</button>';
    }
    html += '</div>';
  } else {
    var cat = data[hash];
    if (cat) {
      html += '<button class="back" onclick="location.hash=\'#\'">← 뒤로</button>';
      html += '<h1>' + cat.emoji + ' ' + cat.title + '</h1>';
      
      html += '<div class="chips">';
      html += '<button class="chip ' + (currentArea === '전체' ? 'on' : '') + '" onclick="setArea(\'전체\')">전체</button>';
      for (var i = 0; i < areas.length; i++) {
        var a = areas[i];
        html += '<button class="chip ' + (currentArea === a ? 'on' : '') + '" onclick="setArea(\'' + a + '\')">' + a + '</button>';
      }
      html += '</div>';

      var totalCount = 0;
      for (var i = 0; i < areas.length; i++) {
        var areaName = areas[i];
        if (currentArea !== '전체' && currentArea !== areaName) continue;

        var filteredItems = cat.items.filter(function(item) {
          return item[1] === areaName;
        });

        if (filteredItems.length > 0) {
          totalCount += filteredItems.length;
          html += '<h2>' + areaName + '</h2>';
          for (var j = 0; j < filteredItems.length; j++) {
            var item = filteredItems[j];
            var name = item[0];
            var desc = item[2];
            var mapQuery = item[3];
            var rating = item[4];
            var reviews = item[5];
            var isElderFriendly = item[6];

            html += '<div class="item">';
            if (isElderFriendly) {
              html += '<div class="badge-elder">🌸 장모님 모시고 가기 좋은 곳</div>';
            }
            html += '<div class="item-head"><b>' + name + '</b>';
            if (rating) {
              html += '<span class="rating">★ ' + rating + '<small>(' + reviews + ')</small></span>';
            }
            html += '</div>';
            html += '<p>' + desc + '</p>';
            html += '<div class="item-actions"><a href="' + getMapLink(mapQuery) + '" target="_blank" rel="noopener">구글맵</a></div>';
            html += '</div>';
          }
        }
      }

      if (totalCount === 0) {
        html += '<p class="lead" style="margin-top:20px;">이 지역에는 등록된 맛집이 없어요.</p>';
      }
    } else {
      html += '<h1>페이지를 찾을 수 없어요</h1>';
      html += '<button class="back" onclick="location.hash=\'#\';">홈으로 가기</button>';
    }
  }

  html += '<footer>영업시간·휴무는 방문 전 구글맵에서 확인하세요.</footer>';
  appEl.innerHTML = html;
  window.scrollTo(0, 0);
}

function setArea(area) {
  currentArea = area;
  render();
}

window.addEventListener('hashchange', function() {
  currentArea = '전체';
  render();
});

render();
</script>
</body>
</html>
