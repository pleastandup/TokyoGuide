<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>도쿄 긴자·신주쿠·시부야 가이드</title>
<style>
:root {
  --bg: #faf7f2;
  --card: #fff;
  --text: #222;
  --sub: #666;
  --line: #e8e2d8;
  --accent: #d6372b;
  --chip: #fbe9e7;
  --star: #f59e0b;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #17161a;
    --card: #222126;
    --text: #eee;
    --sub: #aaa;
    --line: #34323a;
    --accent: #ff6b5e;
    --chip: #3a2422;
  }
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  line-height: 1.5;
}
main { max-width: 640px; margin: 0 auto; padding: 16px 16px 40px; }
h1 { font-size: 1.4rem; margin: 6px 0 4px; }
.lead { color: var(--sub); font-size: .9rem; margin: 0 0 16px; }
.back { background: none; border: 0; color: var(--accent); font-size: .95rem; padding: 6px 0; cursor: pointer; font-weight: bold; }
.grid { display: grid; gap: 10px; }
.grid.two { grid-template-columns: 1fr 1fr; }
.tile { display: block; width: 100%; text-align: left; background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 14px; padding: 16px; cursor: pointer; }
.tile .e { font-size: 1.8rem; display: block; margin-bottom: 4px; }
.tile b { font-size: 1.05rem; }
.tile small { display: block; color: var(--sub); margin-top: 2px; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 10px; position: sticky; top: 0; background: var(--bg); z-index: 10; }
.chip { white-space: nowrap; border: 0; background: var(--chip); color: var(--accent); padding: 6px 14px; border-radius: 999px; font-size: .85rem; cursor: pointer; }
.chip.on { background: var(--accent); color: #fff; }
h2 { font-size: 1rem; margin: 18px 0 8px; border-left: 4px solid var(--accent); padding-left: 8px; }
.item { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; }
.item-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.item b { font-size: 1rem; }
.rating { font-size: .82rem; font-weight: 600; color: var(--star); white-space: nowrap; }
.rating small { color: var(--sub); font-weight: normal; margin-left: 2px; }
.item p { margin: 4px 0 8px; font-size: .88rem; color: var(--sub); }
.item-actions { display: flex; gap: 6px; align-items: center; }
.item a { font-size: .82rem; color: var(--accent); text-decoration: none; border: 1px solid var(--accent); border-radius: 999px; padding: 3px 10px; display: inline-block; }
footer { color: var(--sub); font-size: .78rem; margin-top: 24px; text-align: center; }
</style>
</head>
<body>
<main id="app"></main>

<script>
var areas = ['긴자', '신주쿠', '시부야', '도쿄역/기타'];
var currentArea = '전체';

var data = {
  sushi: {
    title: '초밥', emoji: '🍣',
    items: [
      ['스시노미도리 긴자점', '긴자', '신선하고 도톰한 재료로 유명하며 세련되게 초밥을 즐길 수 있는 인기 스시야예요.', '梅丘寿司の美登利 銀座店', '4.2', '2,900+'],
      ['스시노미도리 시부야점', '시부야', '시부야 마크시티 내 위치해 쇼핑 전후로 편리하게 방문하기 좋은 초밥 맛집이에요.', '梅丘寿司の美登利 渋谷店', '4.3', '4,500+'],
      ['스시잔마이 신주쿠히가시구치점', '신주쿠', '넓고 쾌적한 공간에서 신선한 참치와 다양한 초밥을 편안하게 맛볼 수 있어요.', 'すしざんまい 新宿東口店', '4.1', '3,900+'],
      ['네무로 하나마루 킷테점', '도쿄역/기타', '도쿄역 마루노우치 킷테 빌딩에 위치한 홋카이도 산지 직송 인기 회전초밥이에요.', '根室花まる 丸の内店', '4.1', '6,200+']
    ]
  },
  tako: {
    title: '타코야키', emoji: '🐙',
    items: [
      ['긴다코 하이볼 주점 긴자잇초메점', '긴자', '긴자 인근에서 깔끔하게 타코야키와 시원한 음료를 즐길 수 있는 곳이에요.', '築地銀だこ 銀座一丁目店', '3.6', '850+'],
      ['츠키지 긴다코 시부야 동쪽 출구점', '시부야', '시부야 번화가에서 겉바속촉 타코야키를 간편하게 즐기기 좋아요.', '築地銀だこ 渋谷', '3.6', '1,200+']
    ]
  },
  oko: {
    title: '오코노미야키', emoji: '🥞',
    items: [
      ['테판 베이비 (신주쿠)', '신주쿠', '활기차고 트렌디한 철판 요리 전문점으로 맛있는 오코노미야키를 즐길 수 있어요.', 'Pocket Building 테판 베이비', '4.7', '950+'],
      ['Teppanyaki 10 Ginza 6', '긴자', '모던하고 세련된 분위기에서 고품격 철판 요리와 오코노미야키를 즐길 수 있어요.', 'Teppanyaki 10 Ginza 6', '4.3', '720+']
    ]
  },
  ramen: {
    title: '라멘/츠케멘', emoji: '🍥',
    items: [
      ['긴자 하치고', '긴자', '미쉐린 빕구르망 선정, 정갈하고 깊은 풍미의 맑은 국물 라멘을 맛볼 수 있어요.', '銀座 八五', '4.3', '2,100+'],
      ['이치란 신주쿠 중앙동구치점', '신주쿠', '개인 칸막이 좌석에서 진하고 깔끔한 돈코츠 라멘을 편안하게 즐겨보세요.', '一蘭 新宿中央東口店', '4.3', '8,900+'],
      ['이치란 시부야점', '시부야', '시부야역 근처에 있어 쇼핑 중 방문하기 좋은 대표 돈코츠 라멘 전문점이에요.', '一蘭 渋谷店', '4.3', '7,500+'],
      ['멘야 무사시 신주쿠 본점', '신주쿠', '두툼한 차슈와 깊은 감칠맛의 국물이 매력적인 신주쿠 대표 라멘 맛집이에요.', '麺屋武蔵 新宿本店', '4.3', '4,200+']
    ]
  },
  yaki: {
    title: '야키니쿠/고기', emoji: '🥩',
    items: [
      ['요로니쿠 미나미아오야마', '긴자', '고급스러운 공간에서 최고급 와규 오마카세 코스를 품격 있게 즐길 수 있어요.', 'よろにく 南青山', '4.6', '1,800+'],
      ['규카츠 모토무라 신주쿠 남구치점', '신주쿠', '개인 화로에 입맛대로 구워 먹는 부드러운 규카츠 인기 맛집이에요.', '牛かつもと村 新宿南口店', '4.4', '4,800+'],
      ['규카츠 모토무라 시부야 본점', '시부야', '바삭하고 촉촉한 규카츠를 취향에 맞춰 구워 먹는 시부야의 대표 맛집이에요.', '牛かつもと村 渋谷本店', '4.4', '5,100+'],
      ['야키니쿠 토라지 긴자 8초메점', '긴자', '깔끔하고 정돈된 분위기에서 질 좋은 와규 구이를 쾌적하게 즐길 수 있어요.', '焼肉トラジ 銀座8丁目店', '4.2', '1,100+']
    ]
  },
  cafe: {
    title: '카페/디저트', emoji: '🍰',
    items: [
      ['시세이도 파파라 긴자 본점', '긴자', '클래식한 인테리어와 품격 있는 응대 속에서 정통 디저트를 즐길 수 있어요.', '資生堂パーラー 銀座本店', '4.3', '3,500+'],
      ['카페 드 람브르', '긴자', '1948년부터 이어져 온 깊은 내공의 레트로 핸드드립 커피 명가예요.', 'カフェ ド ランブル', '4.4', '1,600+'],
      ['블루보틀 커피 긴자 카페', '긴자', '모던하고 깔끔한 분위기에서 산뜻한 스페셜티 커피를 맛볼 수 있어요.', 'ブルーボトルコーヒー 銀座カフェ', '4.2', '2,200+'],
      ['카페 세이부 신주쿠', '신주쿠', '화려한 레트로 다방 감성 속에서 여유롭게 디저트와 커피를 즐길 수 있어요.', '珈琲西武 新宿', '4.3', '2,800+']
    ]
  }
};

function getMapLink(query) {
  return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(query);
}

function render() {
  var hash = location.hash.replace('#/', '');
  var appEl = document.getElementById('app');
  var html = '';

  if (!hash) {
    html += '<h1>도쿄 긴자·신주쿠·시부야 가이드</h1>';
    html += '<p class="lead">성인 여성 여행을 위한 식당 가이드예요</p>';
    html += '<div class="grid two">';
    for (var key in data) {
      var cat = data[key];
      html += '<button class="tile" onclick="location.hash=\'#/' + key + '\'">';
      html += '<span class="e">' + cat.emoji + '</span>';
      html += '<b>' + cat.title + '</b>';
      html += '<small>' + cat.items.length + '곳</small>';
      html += '</button>';
    }
    html += '</div>';
  } else {
    var cat = data[hash];
    if (cat) {
      html += '<button class="back" onclick="location.hash=\'#\'">← 뒤로</button>';
      html += '<h1>' + cat.emoji + ' ' + cat.title + '</h1>';
      
      html += '<div class="chips">';
      html += '<button class="chip ' + (currentArea === '전체' ? 'on' : '') + '" onclick="setArea(\'전체\')">전체</button>';
      for (var i = 0; i < areas.length; i++) {
        var a = areas[i];
        html += '<button class="chip ' + (currentArea === a ? 'on' : '') + '" onclick="setArea(\'' + a + '\')">' + a + '</button>';
      }
      html += '</div>';

      var totalCount = 0;
      for (var i = 0; i < areas.length; i++) {
        var areaName = areas[i];
        if (currentArea !== '전체' && currentArea !== areaName) continue;

        var filteredItems = cat.items.filter(function(item) {
          return item[1] === areaName;
        });

        if (filteredItems.length > 0) {
          totalCount += filteredItems.length;
          html += '<h2>' + areaName + '</h2>';
          for (var j = 0; j < filteredItems.length; j++) {
            var item = filteredItems[j];
            var name = item[0];
            var desc = item[2];
            var mapQuery = item[3];
            var rating = item[4];
            var reviews = item[5];

            html += '<div class="item">';
            html += '<div class="item-head"><b>' + name + '</b>';
            if (rating) {
              html += '<span class="rating">★ ' + rating + '<small>(' + reviews + ')</small></span>';
            }
            html += '</div>';
            html += '<p>' + desc + '</p>';
            html += '<div class="item-actions"><a href="' + getMapLink(mapQuery) + '" target="_blank" rel="noopener">구글맵</a></div>';
            html += '</div>';
          }
        }
      }

      if (totalCount === 0) {
        html += '<p class="lead" style="margin-top:20px;">이 지역에는 등록된 맛집이 없어요.</p>';
      }
    } else {
      html += '<h1>페이지를 찾을 수 없어요</h1>';
      html += '<button class="back" onclick="location.hash=\'#\';">홈으로 가기</button>';
    }
  }

  html += '<footer>영업시간·휴무는 방문 전 구글맵에서 확인하세요.</footer>';
  appEl.innerHTML = html;
  window.scrollTo(0, 0);
}

function setArea(area) {
  currentArea = area;
  render();
}

window.addEventListener('hashchange', function() {
  currentArea = '전체';
  render();
});

render();
</script>
</body>
</html>
