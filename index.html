<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>도쿄 긴자·신주쿠·시부야 가이드</title>
<style>
:root {
  --bg: #faf7f2;
  --card: #fff;
  --text: #222;
  --sub: #666;
  --line: #e8e2d8;
  --accent: #d6372b;
  --chip: #fbe9e7;
  --star: #f59e0b;
  --elder-bg: #fdf2f4;
  --elder-text: #c026d3;
  --chain-bg: #eef2ff;
  --chain-text: #4f46e5;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #17161a;
    --card: #222126;
    --text: #eee;
    --sub: #aaa;
    --line: #34323a;
    --accent: #ff6b5e;
    --chip: #3a2422;
    --elder-bg: #381e2b;
    --elder-text: #f472b6;
    --chain-bg: #1e1b4b;
    --chain-text: #818cf8;
  }
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  line-height: 1.5;
}
main { max-width: 640px; margin: 0 auto; padding: 16px 16px 40px; }
h1 { font-size: 1.4rem; margin: 6px 0 4px; }
.lead { color: var(--sub); font-size: .9rem; margin: 0 0 16px; }
.back { background: none; border: 0; color: var(--accent); font-size: .95rem; padding: 6px 0; cursor: pointer; font-weight: bold; }
.grid { display: grid; gap: 10px; }
.grid.two { grid-template-columns: 1fr 1fr; }
.tile { display: block; width: 100%; text-align: left; background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 14px; padding: 16px; cursor: pointer; }
.tile .e { font-size: 1.8rem; display: block; margin-bottom: 4px; }
.tile b { font-size: 1.05rem; }
.tile small { display: block; color: var(--sub); margin-top: 2px; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 10px; position: sticky; top: 0; background: var(--bg); z-index: 10; }
.chip { white-space: nowrap; border: 0; background: var(--chip); color: var(--accent); padding: 6px 14px; border-radius: 999px; font-size: .85rem; cursor: pointer; }
.chip.on { background: var(--accent); color: #fff; }
h2 { font-size: 1rem; margin: 18px 0 8px; border-left: 4px solid var(--accent); padding-left: 8px; }
.item { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; }
.item-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.item b { font-size: 1rem; }
.rating { font-size: .82rem; font-weight: 600; color: var(--star); white-space: nowrap; }
.rating small { color: var(--sub); font-weight: normal; margin-left: 2px; }
.item p { margin: 6px 0 8px; font-size: .88rem; color: var(--sub); }
.item-actions { display: flex; gap: 6px; align-items: center; }
.item a { font-size: .82rem; color: var(--accent); text-decoration: none; border: 1px solid var(--accent); border-radius: 999px; padding: 3px 10px; display: inline-block; }
.badges { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 6px; }
.badge-elder { display: inline-block; background: var(--elder-bg); color: var(--elder-text); font-size: .75rem; font-weight: bold; padding: 2px 8px; border-radius: 6px; }
.badge-chain { display: inline-block; background: var(--chain-bg); color: var(--chain-text); font-size: .75rem; font-weight: bold; padding: 2px 8px; border-radius: 6px; }
footer { color: var(--sub); font-size: .78rem; margin-top: 24px; text-align: center; }
</style>
</head>
<body>
<main id="app"></main>

<script>
var areas = ['신주쿠', '긴자', '시부야', '도쿄역/기타'];
var currentArea = '전체';

// 데이터 구조: [명칭, 지역, 설명, 구글검색어, 평점, 리뷰수, 어르신추천(true/false), 체인점여부(true/false)]
var data = {
  sushi: {
    title: '초밥/일식', emoji: '🍣',
    items: [
      ['스시잔마이 신주쿠히가시구치점', '신주쿠', '일본 대표 회전초밥 체인으로, 넓은 테이블석에서 신선한 참치와 스시를 편하게 즐기실 수 있어요.', 'すしざんまい 新宿東口店', '4.1', '3,900+', true, true],
      ['스시로 신주쿠 3초메점', '신주쿠', '일본 1위 가성비 회전초밥 체인점입니다. 태블릿 주문 및 테이블석이 잘 완비되어 있습니다.', 'スシロー 新宿三丁目店', '4.1', '2,500+', false, true],
      ['스시노미도리 긴자점', '긴자', '도쿄의 인기 프리미엄 초밥 체인으로 도톰한 재료와 정갈한 테이블석이 장점입니다.', '梅丘寿司の美登利 銀座店', '4.2', '2,900+', true, true],
      ['스시노미도리 시부야점', '시부야', '시부야 마크시티 내 위치해 엘리베이터 이용이 편리한 популяр 초밥 체인 매장입니다.', '梅丘寿司の美登利 渋谷店', '4.3', '4,500+', true, true],
      ['네무로 하나마루 킷테점', '도쿄역/기타', '도쿄역 킷테 빌딩 5층의 홋카이도 회전초밥 체인입니다. 정리권을 발권하여 대기할 수 있습니다.', '根室花まる 丸の内店', '4.1', '6,200+', true, true]
    ]
  },
  katsu: {
    title: '돈카츠/일식정식', emoji: '🍱',
    items: [
      ['돈카츠 카츠쿠라 신주쿠 타카시마야점', '신주쿠', '교토 출신의 명품 돈카츠 체인입니다. 백화점 14층에 위치해 어르신 모시기에 아주 정갈하고 쾌적합니다.', '名代とんかつ かつくら 新宿高島屋店', '4.5', '1,100+', true, true],
      ['돈카츠 와코 신주쿠 타카시마야점', '신주쿠', '일본 전국 어디서나 사랑받는 대표 돈카츠 정식 체인점입니다.', 'とんかつ和幸 新宿タカシマヤ店', '4.2', '1,800+', true, true],
      ['카츠센 긴자', '긴자', '긴자에서 차분하고 정갈한 상차림을 선보이는 고급 돈카츠 매장입니다.', 'かつせん 銀座', '4.3', '1,400+', true, false],
      ['이마카츠 롯폰기 본점', '도쿄역/기타', '유명 돈카츠 브랜드의 본점으로, 입에서 녹는 닭안심카츠가 대표 메뉴입니다.', 'イマカツ 六本木本店', '4.4', '1,900+', true, true],
      ['규카츠 모토무라 신주쿠 남구치점', '신주쿠', '유명 규카츠 체인이나 지하 계단 및 협소한 좌석으로 어르신 동반 시 주의가 필요합니다.', '牛かつもと村 新宿南口店', '4.4', '4,800+', false, true]
    ]
  },
  noodle: {
    title: '우동/라멘/면', emoji: '🍜',
    items: [
      ['우동 스이사와 신주쿠 타카시마야점', '신주쿠', '백화점 13층의 정갈한 수제 우동 매장으로, 넓고 쾌적한 테이블석에서 정갈하게 드실 수 있습니다.', '水沢うどん 水澤 新宿タカシマヤ店', '4.2', '520+', true, false],
      ['긴자 기요스기', '긴자', '긴자의 세련되고 넓은 공간에서 편안하게 수제 우동을 즐길 수 있는 곳입니다.', '銀座 ぎんざ 烏重', '4.3', '850+', true, false],
      ['이치란 신주쿠 중앙동구치점', '신주쿠', '일본의 세계적인 돈코츠 라멘 체인이나 독서실형 1인 칸막이 좌석입니다.', '一蘭 新宿中央東口店', '4.3', '8,900+', false, true],
      ['긴자 하치고', '긴자', '미쉐린 빕구르망 라멘집이나 좌석 수가 적고 오랜 대기가 필요합니다.', '銀座 八五', '4.3', '2,100+', false, false]
    ]
  },
  yaki: {
    title: '야키니쿠/고기', emoji: '🥩',
    items: [
      ['야키니쿠 토라지 신주쿠점', '신주쿠', '고급 와규 야키니쿠 체인으로 넓은 룸과 테이블 좌석을 갖추어 장모님 모시기에 최고입니다.', '焼肉トラジ 新宿店', '4.2', '1,300+', true, true],
      ['야키니쿠 토라지 긴자 8초메점', '긴자', '독립된 개별 룸과 고급스러운 서비스를 갖춘 유명 야키니쿠 프랜차이즈입니다.', '焼肉トラジ 銀座8丁目店', '4.2', '1,100+', true, true]
    ]
  },
  snack: {
    title: '오코노미야키/타코야키', emoji: '🥞',
    items: [
      ['오코노미야키 몬자 무시야네뇨 시부야점', '시부야', '시부야의 넓고 쾌적한 철판 요리 매장으로 여유롭게 즐길 수 있습니다.', '月島もんじゃ むしやねん 渋谷', '4.2', '610+', true, false],
      ['츠키지 긴다코 시부야점', '시부야', '일본 1위 타코야키 대표 체인점입니다. 바삭하고 촉촉한 타코야키를 간편하게 맛보실 수 있어요.', '築地銀だこ 渋谷店', '4.1', '1,200+', false, true]
    ]
  },
  cafe: {
    title: '카페/다이닝', emoji: '🍰',
    items: [
      ['카페 세이부 니시신주쿠점', '신주쿠', '신주쿠의 유서 깊은 카페 브랜드로, 레트로하고 편안한 소파 좌석에서 디저트를 즐길 수 있습니다.', '珈琲西武 西新宿店', '4.3', '2,500+', true, true],
      ['블루보틀 커피 긴자 카페', '긴자', '글로벌 스페셜티 커피 체인으로, 쇼핑몰 내 쾌적한 매장에서 쉬어가기 좋습니다.', 'ブルーボトルコーヒー 銀座カフェ', '4.2', '2,200+', true, true]
    ]
  }
};

function getMapLink(query) {
  return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(query);
}

function render() {
  var hash = location.hash.replace('#/', '');
  var appEl = document.getElementById('app');
  var html = '';

  if (!hash) {
    html += '<h1>도쿄 긴자·신주쿠·시부야 가이드</h1>';
    html += '<p class="lead">가족 여행(장모님 모심)을 위한 쾌적 식당 가이드예요</p>';
    html += '<div class="grid two">';
    for (var key in data) {
      var cat = data[key];
      html += '<button class="tile" onclick="location.hash=\'#/' + key + '\'">';
      html += '<span class="e">' + cat.emoji + '</span>';
      html += '<b>' + cat.title + '</b>';
      html += '<small>' + cat.items.length + '곳</small>';
      html += '</button>';
    }
    html += '</div>';
  } else {
    var cat = data[hash];
    if (cat) {
      html += '<button class="back" onclick="location.hash=\'#\'">← 뒤로</button>';
      html += '<h1>' + cat.emoji + ' ' + cat.title + '</h1>';
      
      html += '<div class="chips">';
      html += '<button class="chip ' + (currentArea === '전체' ? 'on' : '') + '" onclick="setArea(\'전체\')">전체</button>';
      for (var i = 0; i < areas.length; i++) {
        var a = areas[i];
        html += '<button class="chip ' + (currentArea === a ? 'on' : '') + '" onclick="setArea(\'' + a + '\')">' + a + '</button>';
      }
      html += '</div>';

      var totalCount = 0;
      for (var i = 0; i < areas.length; i++) {
        var areaName = areas[i];
        if (currentArea !== '전체' && currentArea !== areaName) continue;

        var filteredItems = cat.items.filter(function(item) {
          return item[1] === areaName;
        });

        if (filteredItems.length > 0) {
          totalCount += filteredItems.length;
          html += '<h2>' + areaName + '</h2>';
          for (var j = 0; j < filteredItems.length; j++) {
            var item = filteredItems[j];
            var name = item[0];
            var desc = item[2];
            var mapQuery = item[3];
            var rating = item[4];
            var reviews = item[5];
            var isElderFriendly = item[6];
            var isChain = item[7];

            html += '<div class="item">';
            html += '<div class="badges">';
            if (isElderFriendly) {
              html += '<span class="badge-elder">🌸 장모님 모시고 가기 좋은 곳</span>';
            }
            if (isChain) {
              html += '<span class="badge-chain">🏢 프랜차이즈 체인</span>';
            }
            html += '</div>';
            
            html += '<div class="item-head"><b>' + name + '</b>';
            if (rating) {
              html += '<span class="rating">★ ' + rating + '<small>(' + reviews + ')</small></span>';
            }
            html += '</div>';
            html += '<p>' + desc + '</p>';
            html += '<div class="item-actions"><a href="' + getMapLink(mapQuery) + '" target="_blank" rel="noopener">구글맵</a></div>';
            html += '</div>';
          }
        }
      }

      if (totalCount === 0) {
        html += '<p class="lead" style="margin-top:20px;">이 지역에는 등록된 맛집이 없어요.</p>';
      }
    } else {
      html += '<h1>페이지를 찾을 수 없어요</h1>';
      html += '<button class="back" onclick="location.hash=\'#\';">홈으로 가기</button>';
    }
  }

  html += '<footer>영업시간·휴무는 방문 전 구글맵에서 확인하세요.</footer>';
  appEl.innerHTML = html;
  window.scrollTo(0, 0);
}

function setArea(area) {
  currentArea = area;
  render();
}

window.addEventListener('hashchange', function() {
  currentArea = '전체';
  render();
});

render();
</script>
</body>
</html>
